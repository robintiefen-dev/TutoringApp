{% load static%}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
            content="width=device-width, initial-scale=1.0">
        
        <title>
            {% block title %}CS Tutoring{% endblock %}
        </title>

        <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/dist/zephyr/bootstrap.min.css"
              rel="stylesheet">

        <link rel="stylesheet" href="{% static 'css/style.css' %}">
    </head>

    <body>
            <nav class="navbar navbar-expand-lg bg-primary"
        data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">
                CS Tutoring
            </a>

            <div class="navbar-nav ms-auto flex-row align-items-center gap-4">
                <a class="nav-link"
                href="{% url 'home' %}#teaching-assistants">
                    Teaching Assistants
                </a>

                
                {% if user.is_authenticated %}
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="nav-link">
                            Logout
                        </button>
                    </form>
                {% else %}
                    <a class="nav-link" href="{% url 'login' %}">
                        Login
                    </a>
                    <a class="nav-link" href="{% url 'ta_signup' %}">
                        Sign up
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
