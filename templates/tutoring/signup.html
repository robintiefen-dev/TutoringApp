
{% extends "base.html" %}

{% block title %}TA Registration{% endblock %}

{% block content %}

<section class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        TA Registration
                    </h2>

                    <p class="text-center text-muted">
                        Register for a tutoring account
                        after approval of your position.
                    </p>

                    <form method="post">
                        {% csrf_token %}

                        {{ form.as_p }}

                        <button type="submit"
                                class="btn btn-primary w-100 mt-3">
                            Sign Up
                        </button>
                    </form>

                    <p class="text-center text-muted mt-4">
                        TA access granted upon approval.
                    </p>

                    <p class="text-center">
                        Already have an account?
                        <a href="{% url 'login' %}">
                            Log In
                        </a>
                    </p>

                </div>
            </div>

        </div>
    </div>
</section>

{% endblock %}
